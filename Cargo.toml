[workspace]
resolver = "2"
members = [
    "crates/artcraft-domain",
    "crates/artcraft-platform",
    "crates/artcraft-catalog",
    "crates/artcraft-discovery",
    "crates/artcraft-packages",
    "crates/artcraft-reconcile",
    "crates/artcraft-migration",
    "crates/artcraft-backup",
    "crates/artcraft-integrity",
    "crates/artcraft-events",
    "crates/artcraft-storage",
    "crates/artcraft-config",
    "crates/artcraft-application",
    "crates/artcraft-cli",
    "crates/artcraft-tui",
    "apps/artcraft",
]
default-members = ["apps/artcraft"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ArtCraft TUI Contributors"]

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
# cli
clap = { version = "4", features = ["derive"] }
# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# errors
thiserror = "2"
jtd = "0.3"
anyhow = "1"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# http
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
# crypto
sha2 = "0.10"
# db
rusqlite = { version = "0.32", features = ["bundled"] }
# paths
directories = "5"
# semver
semver = "1"
# temp
tempfile = "3"
fs2 = "3"
# archives
tar = "0.4"
flate2 = "1"
# tui
ratatui = "0.29"
crossterm = "0.28"
# testing
insta = "1"
proptest = "1"
assert_cmd = "2"
predicates = "3"
mockall = "0.13"
