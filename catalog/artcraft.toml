# Bundled ArtCraft application catalog (offline baseline).
# Community apps included as extensions.

[[applications]]
id = "photocraft"
display_name = "PhotoCraft"
description = "Open-source image editor"
publisher = "ArtCraft"
official_repository = "https://github.com/storytold/photocraft"
supported_platforms = ["linux", "macos", "windows"]
supported_arches = ["x86_64", "aarch64"]
known_package_ids = ["ai.storyteller.photocraft"]
executable_names = ["photocraft", "PhotoCraft"]
desktop_ids = ["ai.storyteller.photocraft.desktop"]
known_data_locations = ["~/.local/share/photocraft", "~/.config/photocraft"]
is_community = false

